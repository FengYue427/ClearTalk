<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#5B8DEF">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" data-i18n="app.description" content="AI驱动的沟通文本生成助手，帮助您清晰得体地表达诉求">
    <title data-i18n="app.name">ClearTalk</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
</head>
<body>
    <!-- 离线提示 -->
    <div id="offline-indicator" class="offline-indicator hidden">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="1" y1="1" x2="23" y2="23"/>
            <path d="M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>
        </svg>
        <span data-i18n="app.offline_mode">离线模式</span>
    </div>

    <!-- 首页 -->
    <div id="page-home" class="page active">
        <header class="header">
            <h1 data-i18n="app.name">ClearTalk</h1>
            <div class="header-actions">
                <button class="btn-icon" id="btn-market" data-i18n-title="nav.market">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                </button>
                <button class="btn-icon" id="btn-user" data-i18n-title="nav.user">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </button>
                <button class="btn-icon" id="btn-history" data-i18n-title="nav.history">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 分类标签 -->
        <div id="category-tabs" class="category-tabs"></div>

        <!-- 场景列表 -->
        <div id="scene-list" class="scene-list"></div>
    </div>

    <!-- 场景详情页 -->
    <div id="page-scene-detail" class="page">
        <!-- 内容由 JS 动态渲染 -->
    </div>

    <!-- 历史记录页 -->
    <div id="page-history" class="page">
        <!-- 内容由 JS 动态渲染 -->
    </div>

    <!-- 用户中心页 -->
    <div id="page-user" class="page">
        <!-- 内容由 JS 动态渲染 -->
    </div>

    <!-- 场景市场页 -->
    <div id="page-market" class="page">
        <!-- 内容由 JS 动态渲染 -->
    </div>

    <!-- 对话模拟页 -->
    <div id="page-dialogue" class="page">
        <!-- 内容由 JS 动态渲染 -->
    </div>

    <!-- 设置页 -->
    <div id="page-settings" class="page">
        <!-- 内容由 JS 动态渲染 -->
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast hidden"></div>

    <!-- 加载脚本 -->
    <script type="module" src="./main.js"></script>
</body>
</html>
